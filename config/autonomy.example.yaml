# Copy outside the source checkout, e.g. to ~/.config/roundhouse/autonomy.yaml.
# All relative file paths resolve against the configuration file's directory.
decision:
  kind: codex
  bin: codex
max_jobs_per_run: 20
projects:
  - id: example
    name: Example
    purpose: Deliver useful improvements to this project.
    success_state: Requested improvements pass project checks and reach a delivery branch.
    status: active
    repository: /absolute/path/to/a/clean/repository
    base_ref: HEAD
    remote: origin
    context_sources: [README.md]
    weight: 1
    max_concurrent_runs: 1
    runtime: local
    executor:
      kind: codex
      bin: codex
    timeout_ms: 7200000
    policy:
      allow_autonomous: true
      approval_required: false
      project_confidence: 0.85
      execution_confidence: 0.85
      shipping: push_branch
      continuation: continue_project_queue
      review_after_shipping: false
      max_rework_attempts: 1
    verification:
      - id: tests
        command: [npm, test]
      - id: checks
        command: [npm, run, check]

  # Herdr is opt-in and drives an existing operator-configured remote agent.
  # The remote machine/agent must be able to access the exact prepared worktree
  # path and content; Roundhouse still verifies, commits, and ships locally.
  # - id: remote-example
  #   ...
  #   runtime: herdr
  #   herdr:
  #     machine: build-host
  #     agent: existing-agent-target
  #     workspace_mode: shared_worktree

  # Machine-local Herdr lets the remote agent work in its own repository. A local
  # repository is optional, but local context_sources/agent source files then are
  # unavailable. Only commit_only and push_branch are supported in this mode.
  # - id: kmac-imac
  #   name: Kmac on iMac
  #   purpose: Deliver approved Kmac work on the iMac repository.
  #   success_state: Remote checks pass and the exact job branch is committed and pushed.
  #   status: active
  #   runtime: herdr
  #   herdr:
  #     machine: iMac
  #     agent: roundhouse-imac
  #     workspace_mode: machine_local
  #     working_directory: /home/ryngrn/kmac
  #   policy:
  #     allow_autonomous: true
  #     shipping: push_branch
  #   verification:
  #     - id: tests
  #       command: [npm, test]
