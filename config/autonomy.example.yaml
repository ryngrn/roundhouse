# Copy outside the source checkout, e.g. to ~/.config/roundhouse/autonomy.yaml.
# All relative file paths resolve against the configuration file's directory.
decision:
  kind: codex # or claude; provider fallback is intentionally not supported
  bin: codex
# Optional conversation adapters use the same provider contract but never receive
# execution tools or workflow authority.
# conversation:
#   kind: claude
#   bin: claude
max_jobs_per_run: 20
execution:
  # Global execution slots default to one when this block is omitted.
  capacity: 1
  capabilities: [local]
  # Providers use deterministic cheapest-sufficient routing. Lower tiers are
  # skipped only for a recorded capability, risk, confidence, context, or
  # latency gap. A project provider preserves the existing executor path.
  # Command providers may add `probe: [/absolute/path/to/provider, probe]` to
  # advertise current availability and capabilities before execution.
  providers:
    - id: local-software
      kind: project
      capabilities: [local]
      tier: 1
      max_risk: consequential
      min_confidence: 0.85
      context_window: 262144
      latency_ms: 30000
  resource_limits:
    workspace: 1
projects:
  - id: example
    name: Example
    purpose: Deliver useful improvements to this project.
    success_state: Requested improvements pass project checks and reach a delivery branch.
    status: active
    # Existing software projects default to true. Set false for non-code work;
    # omit repository/context files/check commands and use durable_output. The
    # built-in provider retains structured results, files, hashes, and execution
    # provenance without Git.
    repository_required: true
    repository: /absolute/path/to/a/clean/repository
    base_ref: HEAD
    remote: origin
    context_sources: [README.md]
    weight: 1
    max_concurrent_runs: 1
    required_capabilities: [local]
    resource_requirements:
      workspace: 1
    runtime: local
    executor:
      kind: codex # or claude; Claude may declare allowed_tools explicitly
      bin: codex
    timeout_ms: 7200000
    policy:
      allow_autonomous: true
      approval_required: false
      project_confidence: 0.85
      execution_confidence: 0.85
      shipping: push_branch
      continuation: continue_project_queue
      review_after_shipping: false
      max_rework_attempts: 1
    verification:
      - id: tests
        command: [npm, test]
      - id: checks
        command: [npm, run, check]

  # A machine-local Herdr project works in an existing repository on the fleet
  # machine. Roundhouse records the correlated remote check/commit/push report;
  # it does not claim to inspect that remote filesystem independently.
  # - id: kmac-imac
  #   name: Kmac on iMac
  #   purpose: Deliver approved Kmac work on the iMac repository.
  #   success_state: Remote checks pass and the exact job branch is pushed.
  #   status: active
  #   runtime: herdr
  #   herdr:
  #     machine: iMac
  #     agent: roundhouse-imac
  #     # Optional Roundhouse-owned placement bounds. Existing static machine
  #     # and agent settings are adapted into the same durable evidence contract.
  #     placement:
  #       machine_selectors: [iMac]
  #       platforms: [macos]
  #       tools: [claude]
  #       agents: [roundhouse-imac]
  #       capabilities: [repository]
  #     workspace_mode: machine_local
  #     working_directory: /home/ryngrn/kmac
  #   executor:
  #     # Requires remote Claude installation/version/auth/quota/availability
  #     # advertisements before Herdr dispatches bounded work.
  #     kind: claude
