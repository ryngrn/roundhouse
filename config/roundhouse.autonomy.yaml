# Portable self-development configuration. Personal projects belong in private files.
decision:
  kind: codex
  bin: codex
max_jobs_per_run: 10
projects:
  - id: roundhouse
    name: Roundhouse
    purpose: Turn human intent into useful verified work with less manual coordination.
    success_state: Depot work is interpreted, executed, verified, and delivered under explicit project policy.
    status: active
    repository: ..
    base_ref: HEAD
    remote: origin
    context_sources: [README.md, docs/autonomous-workflow.md, docs/architecture.md]
    weight: 1
    max_concurrent_runs: 1
    runtime: local
    executor:
      kind: codex
      bin: codex
    policy:
      allow_autonomous: true
      project_confidence: 0.85
      execution_confidence: 0.85
      shipping: push_branch
      continuation: stop_after_job
      max_rework_attempts: 1
    verification:
      - id: dependencies
        command: [npm, ci, --ignore-scripts, --prefer-offline]
      - id: tests
        command: [npm, test]
      - id: syntax
        command: [npm, run, check]
      - id: whitespace
        command: [git, diff, --check, HEAD^, HEAD]
